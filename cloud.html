<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>瞳治视觉训练助手 · 云端版</title>
<style>
  /* ============ 设计令牌 ============ */
  :root{
    --bg:#f4f8fa; --card:#fff; --primary:#1a7a8c; --primary-dark:#0f5a68;
    --accent:#f2a33c; --success:#2e9e6b; --bad:#e05a4f; --text:#1f2d33;
    --muted:#6b7a82; --line:#e3ebef;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  .wrap{ max-width:460px; margin:0 auto; min-height:100vh; position:relative; background:var(--bg); padding:0 16px 40px; }
  #content{ animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  /* ============ 顶部栏 ============ */
  .topbar{
    margin:0 -16px; background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff; padding:20px 20px 18px; border-radius:0 0 22px 22px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .topbar .brand{ font-size:19px; font-weight:700; letter-spacing:1px; }
  .topbar .who{ font-size:13px; opacity:.92; margin-top:4px; display:flex; align-items:center; gap:6px; }
  .topbar .tag{ display:inline-block; padding:1px 10px; border-radius:999px; font-size:12px; background:rgba(255,255,255,.22); }
  .topbar .logout{ border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; flex-shrink:0; }

  /* ============ 登录页 ============ */
  .login-hero{ margin:0 -16px; text-align:center; padding:48px 24px 30px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); border-radius:0 0 28px 28px; color:#fff; }
  .login-hero .logo{ font-size:46px; line-height:1; }
  .login-hero h1{ font-size:22px; margin:12px 0 4px; letter-spacing:1px; }
  .login-hero p{ font-size:13px; opacity:.85; margin:0; }
  .login-card{ background:var(--card); margin:-20px 0 0; border-radius:18px; padding:22px 18px; box-shadow:0 6px 24px rgba(20,60,80,.14); }

  /* ============ 卡片 & 标题 ============ */
  .card{ background:var(--card); margin:12px 0; border-radius:16px; padding:16px 18px; box-shadow:0 2px 10px rgba(20,60,80,.06); }
  .page-title{ font-size:17px; font-weight:700; margin:0; padding:18px 0 2px; }
  .page-sub{ font-size:13px; color:var(--muted); padding:2px 0 0; margin:0; }
  .card h1{ font-size:20px; margin:0 0 4px; }
  .card h2{ font-size:16px; margin:0 0 12px; }
  .sub{ color:var(--muted); font-size:13px; margin:0 0 16px; }

  /* ============ 表单 ============ */
  label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input{
    width:100%; padding:12px; font-size:16px; color:var(--text);
    border:1px solid var(--line); border-radius:12px; background:#fff;
  }
  input:focus{ outline:none; border-color:var(--primary); }

  /* ============ 按钮 ============ */
  .btn{ width:100%; padding:14px; font-size:16px; font-weight:600; border:none; border-radius:14px; cursor:pointer; margin-top:14px; }
  .btn-primary{ background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; }
  .btn-ghost{ background:#eef4f6; color:var(--primary); margin-top:10px; }
  .btn-small{ width:auto; padding:8px 16px; font-size:13px; margin-top:0; border-radius:10px; }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ background:#c6d4da; opacity:1; cursor:default; }

  /* ============ 提示 ============ */
  .msg{ margin-top:12px; font-size:14px; white-space:pre-wrap; }
  .msg.err{ color:var(--bad); } .msg.ok{ color:var(--success); }

  /* ============ 训练处方 ============ */
  textarea{ width:100%; padding:12px; font-size:15px; color:var(--text); border:1px solid var(--line); border-radius:12px; background:#fff; min-height:90px; resize:vertical; font-family:inherit; }
  textarea:focus{ outline:none; border-color:var(--primary); }
  .rx-check{ display:flex; align-items:center; gap:10px; margin:0 0 8px; font-size:15px; font-weight:600; color:var(--text); cursor:pointer; }
  .rx-check input[type=checkbox]{ width:18px; height:18px; margin:0; accent-color:var(--primary); flex-shrink:0; }
  .rx-param{ margin:0; }
  .rx-preview{ background:#f7fafb; border:1px dashed var(--line); border-radius:12px; padding:14px; font-size:14px; white-space:pre-wrap; color:var(--text); margin-top:12px; }

  /* ============ 列表项（卡片式）============ */
  .list-item{
    background:var(--card); margin:10px 0; border-radius:14px; padding:14px 16px;
    box-shadow:0 2px 10px rgba(20,60,80,.06);
    display:flex; justify-content:space-between; align-items:center; gap:12px;
  }
  .list-item > div{ min-width:0; flex:1; }
  .list-item .t{ font-size:15px; font-weight:600; }
  .list-item .s{ font-size:12px; color:var(--muted); margin-top:2px; }
  .list-item .icon{ width:42px; height:42px; border-radius:12px; background:#fff2e0; display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .chev{ font-size:22px; color:#c0ccd2; flex-shrink:0; }
  .code{ font-family:monospace; font-size:16px; letter-spacing:2px; background:#eef4f6; padding:2px 10px; border-radius:8px; color:var(--primary); }
  .empty{ color:var(--muted); font-size:14px; text-align:center; padding:24px 16px; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }
  .linkbtn{ background:none; border:none; color:var(--primary); font-size:14px; cursor:pointer; padding:0; }
  .small-note{ font-size:12px; color:var(--muted); margin-top:18px; text-align:center; }

  /* ============ 回传记录里的图片/视频 ============ */
  .rec-media{ margin-top:10px; }
  .rec-media img{ display:block; max-width:100%; border-radius:12px; cursor:pointer; box-shadow:0 2px 8px rgba(20,60,80,.08); }
  .rec-media video{ display:block; width:100%; border-radius:12px; background:#000; }

  /* ============ 眼位照 ============ */
  .stage-tabs, .source-tabs { display:flex; gap:8px; margin:14px 0 0; }
  .stage-tab, .source-tab { flex:1; border:none; border-radius:12px; padding:11px 0; font-size:14px; font-weight:600; cursor:pointer; background:#eef4f6; color:var(--muted); }
  .stage-tab.active { background:var(--primary); color:#fff; }
  .source-tab.active { background:var(--accent); color:#fff; }
  .photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .photo-cell { position:relative; aspect-ratio:1/1; border-radius:12px; border:2px dashed #c7d7dd; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; }
  .photo-grid.wide .photo-cell { aspect-ratio:4/3; }
  .photo-cell .pc-dir { position:absolute; top:0; left:0; right:0; z-index:2; background:rgba(26,122,140,.85); color:#fff; font-size:12px; font-weight:700; text-align:center; padding:3px 0; }
  .photo-cell .pc-body { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .photo-cell .pc-add { font-size:30px; color:var(--muted); }
  .photo-cell .pc-hint { font-size:11px; color:var(--muted); }
  .photo-cell img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo-cell.filled { border-style:solid; border-color:var(--success); }
  .photo-status { text-align:center; font-size:13px; color:var(--muted); margin-top:12px; }
  .clear-btn { display:block; margin:8px auto 0; border:none; background:none; color:var(--muted); font-size:13px; cursor:pointer; text-decoration:underline; }

  /* ============ 马斯登球 · 录训练视频 ============ */
  .rec-card{ background:var(--card); margin:12px 0; border-radius:16px; padding:16px; box-shadow:0 2px 10px rgba(20,60,80,.06); }
  .rec-head{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .rec-num{ width:30px; height:30px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; flex-shrink:0; }
  .rec-title{ font-size:17px; font-weight:700; }
  .rec-desc{ font-size:13px; color:var(--muted); margin-bottom:12px; padding-left:40px; }
  .rec-slot{ position:relative; border-radius:14px; overflow:hidden; min-height:170px; background:#eef4f6; display:flex; align-items:center; justify-content:center; }
  .rec-empty{ text-align:center; color:var(--muted); cursor:pointer; padding:28px 20px; width:100%; }
  .rec-empty .ic{ font-size:40px; line-height:1; }
  .rec-empty .t{ font-size:14px; font-weight:600; color:var(--primary); margin-top:8px; }
  .rec-slot video{ display:block; width:100%; max-height:250px; background:#000; }
  .rec-actions{ display:flex; gap:8px; margin-top:10px; }
  .rec-re, .rec-save{ flex:1; border:1px solid var(--line); background:#fff; color:var(--primary); border-radius:12px; padding:10px 0; font-size:14px; font-weight:600; cursor:pointer; }
  .rec-save{ color:var(--success); border-color:var(--success); }

  /* ---- 图片查看器（点开放大 / 双指缩放 / 拖动 / 双击放大，仿微信）---- */
  .img-viewer { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.92); z-index:9999; display:none; align-items:center; justify-content:center; overflow:hidden; touch-action:none; }
  .img-viewer.open { display:flex; }
  #iv-img { max-width:100%; max-height:100%; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; transform:translate(0,0) scale(1); transform-origin:center center; will-change:transform; }
  .iv-close { position:fixed; top:12px; right:12px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.22); color:#fff; font-size:18px; line-height:1; cursor:pointer; z-index:10001; }
  .iv-hint { position:fixed; bottom:20px; left:0; right:0; text-align:center; color:rgba(255,255,255,.55); font-size:12px; pointer-events:none; }

  /* ============ 照片裁剪弹窗 ============ */
  .crop-modal{ position:fixed; inset:0; background:#000; z-index:10000; display:none; flex-direction:column; }
  .crop-modal.open{ display:flex; }
  .crop-top{ display:flex; align-items:center; justify-content:space-between; padding:12px 16px; }
  .crop-btn{ background:none; border:none; color:#fff; font-size:16px; padding:8px 14px; cursor:pointer; }
  .crop-btn.primary{ background:var(--primary); border-radius:999px; font-weight:600; }
  .crop-title{ color:#fff; font-size:16px; font-weight:600; }
  .crop-body{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 16px; }
  .crop-viewport{ position:relative; width:100%; max-width:420px; aspect-ratio:1/1; overflow:hidden; background:#111; touch-action:none; outline:2px solid rgba(255,255,255,.35); outline-offset:-2px; }
  #crop-img{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; max-width:none; }
  .crop-bottom{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px 20px; }
  .crop-hint{ color:rgba(255,255,255,.6); font-size:13px; }

  /* ============ 自定义训练 · 素材/回传缩略图 ============ */
  .custom-assets{ display:flex; flex-wrap:wrap; gap:8px; }
  .custom-assets .asset{ position:relative; width:80px; height:80px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#eef4f6; }
  .custom-assets .asset img, .custom-assets .asset video{ width:100%; height:100%; object-fit:cover; display:block; }
  .custom-assets .asset .x{ position:absolute; top:2px; right:2px; width:20px; height:20px; background:rgba(0,0,0,.65); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; line-height:1; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 / 注册 -->
  <div id="login-view">
    <div class="login-hero">
      <div class="logo">👁️</div>
      <h1>瞳治视觉训练助手</h1>
      <p>云端版 · 用邮箱登录</p>
    </div>
    <div class="login-card">
      <label>邮箱</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
      <label>密码（至少 6 位）</label>
      <input id="password" type="password" placeholder="••••••" autocomplete="current-password">
      <button class="btn btn-primary" id="login-btn">登录</button>
      <button class="btn btn-ghost" id="signup-btn">注册新账号</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- 登录后的主界面 -->
  <div id="main-view" style="display:none;">
    <div class="topbar">
      <div>
        <div class="brand">瞳治视觉训练助手</div>
        <div class="who"><span class="tag" id="role-tag">—</span> <span id="who-name"></span></div>
      </div>
      <button class="logout" id="logout-btn">退出</button>
    </div>
    <div id="content"></div>
  </div>

</div>

<!-- 图片查看器：点开大图，可双指缩放 / 拖动 / 双击放大，仿微信 -->
<div id="img-viewer" class="img-viewer">
  <button class="iv-close" id="iv-close">✕</button>
  <img id="iv-img" src="" alt="">
  <div class="iv-hint">双指缩放 · 双击放大 · 点空白处关闭</div>
</div>

<!-- 裁剪弹窗：把照片裁成正方形再进九宫格 -->
<div id="crop-modal" class="crop-modal">
  <div class="crop-top">
    <button id="crop-cancel" class="crop-btn">取消</button>
    <span class="crop-title">裁成正方形</span>
  </div>
  <div class="crop-body">
    <div class="crop-viewport" id="crop-viewport">
      <img id="crop-img" draggable="false" alt="">
    </div>
  </div>
  <div class="crop-bottom">
    <span class="crop-hint">拖动移动 · 双指缩放</span>
    <button id="crop-done" class="crop-btn primary">确定裁剪</button>
  </div>
</div>

<script src="supabase.js"></script>
<script>
  var SUPABASE_URL = 'https://ucjgcybsvrkfgkszcygq.supabase.co';
  var ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjamdjeWJzdnJrZmdrc3pjeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDY5ODIsImV4cCI6MjEwNzQ4Mjk4Mn0.tMtklRCxDjtO5Lb5cMjqg_LeB5cUxfVOZxxwNRO0aDw';

  var sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

  var $ = function (id) { return document.getElementById(id); };
  var state = { user: null, profile: null, familyId: null, childId: null, childName: null };

  // ---------- 工具 ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtTime(iso) { return new Date(iso).toLocaleString('zh-CN'); }
  function roleText(r) { return r === 'therapist' ? '视训师' : '家长'; }
  function toggleOrig(btn) {
    var box = btn.previousElementSibling;
    var hidden = box.style.display === 'none';
    box.style.display = hidden ? 'block' : 'none';
    btn.textContent = hidden ? '收起原画质' : '看原画质';
  }
  function setStatus(text, isError) {
    var el = $('upload-status');
    if (el) { el.textContent = text; el.className = 'msg ' + (isError ? 'err' : 'ok'); }
  }
  // 把图片缩小尺寸 + 降画质，转成 jpg，让上传/加载更快
  function compressImage(file, maxW, quality) {
    return new Promise(function (resolve) {
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function () {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var scale = Math.min(1, maxW / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (blob) { resolve(blob || file); }, 'image/jpeg', quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }
  // 压缩视频：canvas + MediaRecorder 降分辨率 + 降码率，让上传更快；不支持/失败则退回原文件
  function compressVideo(file, maxW, bitrate) {
    return new Promise(function (resolve) {
      if (typeof MediaRecorder === 'undefined' || typeof HTMLCanvasElement === 'undefined' || !HTMLCanvasElement.prototype.captureStream) {
        resolve(file); return;
      }
      var url = URL.createObjectURL(file);
      var video = document.createElement('video');
      video.muted = true; video.playsInline = true; video.preload = 'auto';
      var done = false;
      function finish(blob) { if (done) return; done = true; URL.revokeObjectURL(url); resolve(blob); }
      video.onloadedmetadata = function () {
        var w = video.videoWidth, h = video.videoHeight;
        if (!w || !h) { finish(file); return; }
        var scale = Math.min(1, maxW / Math.max(w, h));
        var cw = Math.round(w * scale), ch = Math.round(h * scale);
        cw -= cw % 2; ch -= ch % 2;
        if (!cw || !ch) { finish(file); return; }
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        var stream = canvas.captureStream(30);
        var mime = 'video/webm;codecs=vp8';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/webm';
        if (!MediaRecorder.isTypeSupported(mime)) mime = 'video/mp4';
        var rec;
        try {
          rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bitrate });
        } catch (e) {
          try { rec = new MediaRecorder(stream, { videoBitsPerSecond: bitrate }); }
          catch (e2) { stream.getTracks().forEach(function (t) { t.stop(); }); finish(file); return; }
        }
        var chunks = [];
        rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          var blob = new Blob(chunks, { type: rec.mimeType || mime });
          finish(blob.size && blob.size < file.size ? blob : file);
        };
        function draw() {
          if (done) return;
          if (video.readyState >= 2) ctx.drawImage(video, 0, 0, cw, ch);
          if (!video.ended) requestAnimationFrame(draw);
        }
        video.onended = function () { try { rec.stop(); } catch (e) {} };
        video.onerror = function () { finish(file); };
        rec.start();
        video.play().then(function () { draw(); }).catch(function () { try { rec.stop(); } catch (e) {} finish(file); });
      };
      video.onerror = function () { finish(file); };
      video.src = url;
    });
  }

  // ---------- 登录 ----------
  function showLogin() { $('login-view').style.display = 'block'; $('main-view').style.display = 'none'; }
  function showMain() { $('login-view').style.display = 'none'; $('main-view').style.display = 'block'; }
  function showMsg(text, ok) {
    var m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  async function signUp() {
    var email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { showMsg('请填写邮箱和密码'); return; }
    showMsg('正在注册……');
    var res = await sb.auth.signUp({ email: email, password: password });
    if (res.error) { showMsg('注册失败：' + res.error.message); return; }
    if (res.data.session) { showMsg('注册成功，已自动登录', true); afterLogin(res.data.user); }
    else { showMsg('注册成功！请点「登录」进入', true); }
  }
  async function signIn() {
    var email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) { showMsg('请填写邮箱和密码'); return; }
    showMsg('正在登录……');
    var res = await sb.auth.signInWithPassword({ email: email, password: password });
    if (res.error) { showMsg('登录失败：' + res.error.message); return; }
    afterLogin(res.data.user);
  }
  async function signOut() { await sb.auth.signOut(); state.user = null; state.profile = null; showLogin(); }

  // ---------- 登录后：读档案 + 分流 ----------
  async function afterLogin(user) {
    state.user = user;
    await loadProfile();
    showMain();
    home();
  }
  async function loadProfile() {
    var res = await sb.from('profiles').select('role, name, family_id').eq('id', state.user.id).single();
    if (res.error || !res.data) { state.profile = { role: 'parent', name: '', family_id: null }; return; }
    state.profile = res.data;
  }
  function renderTopbar() {
    $('role-tag').textContent = roleText(state.profile.role);
    $('who-name').textContent = state.profile.name ? ('· ' + state.profile.name) : '';
  }
  function home() {
    renderTopbar();
    if (state.profile.role === 'therapist') renderTherapistHome();
    else renderParentHome();

  async function openChildType(cid, type) {
    state.childId = cid;
    var res = await sb.from('children').select('name').eq('id', cid).single();
    var cname = res.data ? res.data.name : '';
    var typeLabel = type === 'eye' ? '眼位照' : (type === 'marsden' ? '马斯登球' : (type === 'custom' ? '自定义训练' : '周边训练'));
    var c = $('content');
    c.innerHTML = '<h2 class="page-title">' + esc(cname) + ' · ' + typeLabel + '</h2>' +
      '<div id="rec-list"></div>' +
      '<button class="btn btn-ghost" onclick="openChild(\'' + cid + '\')">返回分类</button>';
    var rr = await sb.from('records').select('*').eq('child_id', cid).eq('type', type).order('created_at', { ascending: false });
    var box = $('rec-list');
    if (rr.error) { box.innerHTML = '<div class="empty">读取失败：' + esc(rr.error.message) + '</div>'; return; }
    if (!rr.data.length) { box.innerHTML = '<div class="empty">这个分类还没有回传</div>'; return; }
    for (var i = 0; i < rr.data.length; i++) {
      var r = rr.data[i];
      var d = r.data || {};
      var desc = '';
      if (r.type === 'peripheral') desc = '命中 ' + (d.hit || 0) + ' 次 · 未中 ' + (d.miss || 0) + ' 次';
      else if (r.type === 'eye') desc = '眼位照 · ' + eyeStageName(d.stage);
      else if (r.type === 'marsden') desc = '马斯登球 · ' + ((d.slots && d.slots.length) ? (d.slots.length + ' 段视频') : '视频');
      else if (r.type === 'custom') desc = '自定义训练 · ' + (d.custom_title || '回传');
      else desc = r.type;
      var html = '<div class="list-item"><div><div class="t">' + esc(desc) + '</div>' +
        '<div class="s">' + fmtTime(r.created_at) + '</div>';
      var media = r.media || [];
      for (var j = 0; j < media.length; j++) {
        var su = await sb.storage.from('media').createSignedUrl(media[j], 3600);
        if (su.data && su.data.signedUrl) {
          var u = esc(su.data.signedUrl);
          if (/\.(mp4|mov|webm|m4v)$/i.test(media[j])) {
            html += '<video src="' + u + '" controls preload="metadata" style="display:block;width:100%;margin-top:10px;border-radius:12px;background:#000;"></video>';
          } else {
            html += '<img src="' + u + '" class="zoomable" loading="lazy" onclick="openImgViewer(this.src)" style="display:block;max-width:100%;margin-top:10px;border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(20,60,80,.08);">';
          }
        }
      }
      // 原画质（若有）：默认隐藏，点「看原画质」展开
      var originals = (r.data && r.data.originals) || [];
      var origHtml = '';
      for (var oi = 0; oi < originals.length; oi++) {
        var so = await sb.storage.from('media').createSignedUrl(originals[oi], 3600);
        if (so.data && so.data.signedUrl) {
          origHtml += '<video src="' + esc(so.data.signedUrl) + '" controls preload="metadata" style="display:block;width:100%;margin-top:10px;border-radius:12px;background:#000;"></video>';
        }
      }
      if (origHtml) {
        html += '<div class="orig-box" style="display:none;">' + origHtml + '</div>' +
          '<button class="btn btn-ghost btn-small" style="margin-top:8px;" onclick="toggleOrig(this)">看原画质</button>';
      }
      html += '</div><button class="btn btn-ghost btn-small" style="flex-shrink:0;" onclick="deleteRecord(\'' + r.id + '\',\'' + type + '\')">删除</button></div>';
      box.innerHTML += html;
    }
  }

  // 视训师：删除一条回传（连同它的照片/视频文件）
  async function deleteRecord(recId, type) {
    if (!confirm('确定删除这条回传？相关的照片/视频也会一起删除。')) return;
    var r = await sb.from('records').select('media,data').eq('id', recId).single();
    if (r.data) {
      var paths = (r.data.media || []).slice();
      var orig = (r.data.data && r.data.data.originals) || [];
      orig.forEach(function (p) { paths.push(p); });
      if (paths.length) { await sb.storage.from('media').remove(paths); }
    }
    var res = await sb.from('records').delete().eq('id', recId);
    if (res.error) { alert('删除失败：' + res.error.message); return; }
    openChildType(state.childId, type);
  }

  function collectRxDraft() {
    var projects = [];
    var checks = $('rx-projects').querySelectorAll('.rx-check input:checked');
    for (var i = 0; i < checks.length; i++) {
      var key = checks[i].getAttribute('data-key');
      var p = RX_PROJECTS.filter(function (x) { return x.key === key; })[0];
      var param = $('rx-projects').querySelector('.rx-param[data-key="' + key + '"]').value.trim();
      projects.push({ key: key, title: p.title, param: param });
    }
    return { projects: projects, note: $('rx-note').value.trim() };
  }

  function genRx() {
    var draft = collectRxDraft();
    if (!draft.projects.length) { alert('请至少勾选一个训练项目'); return; }
    var p = { title: todayStrCN(), items: JSON.stringify(draft.projects), note: draft.note };
    $('rx-preview').textContent = rxText(p, state.childName);
    $('rx-preview').style.display = 'block';
    $('rx-save').style.display = 'block';
  }

  async function saveRx() {
    var draft = collectRxDraft();

    var res = await sb.from('prescriptions').insert({
      child_id: state.childId, title: todayStrCN(), items: JSON.stringify(draft.projects), note: draft.note
    });
    if (res.error) { alert('保存失败：' + res.error.message); return; }

    openChild(state.childId);

  function addCustomFiles(files, type) {
    for (var i = 0; i < files.length; i++) {
      customMedia.push({ file: files[i], url: URL.createObjectURL(files[i]), type: type });
    }
    renderCustomAssets();
  }
  function renderCustomAssets() {
    var box = $('custom-media');
    if (!box) return;
    box.innerHTML = '';
    if (!customMedia.length) { box.innerHTML = '<div class="empty" style="padding:8px 0;">还没有素材，可加图片或视频</div>'; return; }
    customMedia.forEach(function (m, i) {
      var d = document.createElement('div');
      d.className = 'asset';
      d.innerHTML = (m.type === 'video' ? '<video src="' + m.url + '" muted></video>' : '<img src="' + m.url + '">') + '<div class="x">×</div>';
      d.querySelector('.x').addEventListener('click', function () {
        if (m.url && m.url.indexOf('blob:') === 0) URL.revokeObjectURL(m.url);
        customMedia.splice(i, 1);
        renderCustomAssets();
      });
      box.appendChild(d);
    });
  }

  async function saveCustom() {
    var name = $('custom-name').value.trim();
    if (!name) { alert('请先填训练名称'); return; }
    var desc = $('custom-desc').value.trim();
    var btn = $('custom-save');
    btn.disabled = true; btn.textContent = '保存中…';

    // 1. 新建项目先插一条，拿到 id（编辑则沿用原 id）
    var projId = customDraftId;
    if (!projId) {
      var ins = await sb.from('custom_projects').insert({ child_id: state.childId, title: name, content: desc, media: [] }).select();
      if (ins.error) { alert('保存失败：' + ins.error.message); btn.disabled = false; btn.textContent = '保存并布置'; return; }
      projId = ins.data[0].id;
    }

    // 2. 上传新素材（图片压缩；视频原样上传保证教程清晰度）
    var finalMedia = [];
    for (var i = 0; i < customMedia.length; i++) {
      var m = customMedia[i];
      if (m.path) { finalMedia.push({ path: m.path, type: m.type }); continue; }
      var f = m.file;
      var ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!ext || ext.length > 5) ext = (m.type === 'video' ? 'mp4' : 'jpg');
      if (m.type === 'image') { f = await compressImage(f, 1280, 0.7); ext = 'jpg'; }
      var path = state.childId + '/custom/' + projId + '/' + Date.now() + '_' + i + '.' + ext;
      var up = await sb.storage.from('media').upload(path, f);
      if (up.error) { alert('素材上传失败：' + up.error.message); btn.disabled = false; btn.textContent = '保存并布置'; return; }
      finalMedia.push({ path: path, type: m.type });
    }

    // 3. 更新标题/内容/素材
    var upd = await sb.from('custom_projects').update({ title: name, content: desc, media: finalMedia }).eq('id', projId);
    if (upd.error) { alert('保存失败：' + upd.error.message); btn.disabled = false; btn.textContent = '保存并布置'; return; }
    alert('已保存，家长能看到啦！');
    openChild(state.childId);
  }

  async function submitRecord() {
    var hit = parseInt($('hit').value) || 0, miss = parseInt($('miss').value) || 0;
    var files = $('media-input').files;
    var btn = $('submit-btn');
    btn.disabled = true;
    setStatus('正在提交……');

    // 1. 先建回传记录，拿到记录 id
    var res = await sb.from('records').insert({
      child_id: state.childId, type: 'peripheral', data: { hit: hit, miss: miss }
    }).select();
    if (res.error) { setStatus('提交失败：' + res.error.message, true); btn.disabled = false; return; }
    var recId = res.data[0].id;

    // 2. 上传照片/视频（图片先压缩，减小体积，上传更快）
    var media = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      var ext = (f.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '');
      if (!ext || ext.length > 5) ext = 'bin';
      if (f.type.indexOf('image/') === 0) {
        setStatus('正在压缩照片 ' + (i + 1) + '/' + files.length + ' …');
        f = await compressImage(f, 1280, 0.7);
        ext = 'jpg';
      } else if (f.type.indexOf('video/') === 0) {
        setStatus('正在压缩视频 ' + (i + 1) + '/' + files.length + ' …');
        var cv = await compressVideo(f, 640, 1000000);
        if (cv !== f) { f = cv; ext = (cv.type === 'video/webm') ? 'webm' : 'mp4'; }
      }
      setStatus('正在上传 ' + (i + 1) + '/' + files.length + ' …');
      var path = state.childId + '/' + recId + '/' + Date.now() + '_' + (i + 1) + '.' + ext;
      var up = await sb.storage.from('media').upload(path, f);
      if (up.error) { setStatus('上传失败：' + up.error.message, true); btn.disabled = false; return; }
      media.push(path);
    }

    // 3. 把文件路径存回这条记录
    if (media.length) {
      var upd = await sb.from('records').update({ media: media }).eq('id', recId);
      if (upd.error) { setStatus('保存失败：' + upd.error.message, true); btn.disabled = false; return; }
    }
    setStatus('回传成功！视训师那边已经能看到了');
    setTimeout(function () { home(); }, 600);
  }

  // ---------- 眼位照（拍满 9 张 → 拼图 → 上传）----------
  var EYE_DIRS = [
    { name:'上',   col:1, row:0 },
    { name:'下',   col:1, row:2 },
    { name:'左',   col:0, row:1 },
    { name:'右',   col:2, row:1 },
    { name:'左上', col:0, row:0 },
    { name:'左下', col:0, row:2 },
    { name:'右上', col:2, row:0 },
    { name:'右下', col:2, row:2 },
    { name:'正视', col:1, row:1 }
  ];
  var EYE_STAGES = [
    { id:'right',  label:'右眼', cellW:560, cellH:560 },
    { id:'left',   label:'左眼', cellW:560, cellH:560 },
    { id:'double', label:'双眼', cellW:560, cellH:560 }
  ];
  var eyeStage = 'right';
  var eyePhotos = {};       // eyePhotos[阶段][方位] = { url, file }
  var eyePendingDir = null;
  var eyeSource = 'camera';
  var eyeChildName = '';

  function eyeStageName(s) {
    return s === 'left' ? '左眼' : (s === 'double' ? '双眼' : '右眼');
  }
  function eyeStageCfg() { return EYE_STAGES.filter(function (s) { return s.id === eyeStage; })[0]; }
  function eyeStageLabel() { return eyeStageCfg().label; }
  function eyeCurPhotos() { return eyePhotos[eyeStage] || (eyePhotos[eyeStage] = {}); }

      '<div class="small-note">遮住另一只眼 · 从正前方拍 · 方位以孩子的左右为准</div>' +
      '<input type="file" id="eye-input" accept="image/*" style="position:absolute; left:-9999px; width:1px; height:1px;">' +
      '<input type="file" id="eye-input-camera" accept="image/*" capture="environment" style="position:absolute; left:-9999px; width:1px; height:1px;">';

    var tabs = c.querySelectorAll('.stage-tab');

      };

    for (var k = 0; k < srcs.length; k++) {
      srcs[k].onclick = function () {
        eyeSource = this.getAttribute('data-source');
        for (var m = 0; m < srcs.length; m++) srcs[m].classList.toggle('active', srcs[m] === this);
      };
    }
    $('eye-clear').onclick = clearEye;
    $('eye-gen').onclick = submitEye;

    $('eye-input-camera').onchange = function () { handleEyeFile($('eye-input-camera').files[0]); };

    buildEyeGrid();
  }

  function buildEyeGrid() {
    var grid = $('eye-grid');
    if (!grid) return;
    grid.className = 'photo-grid square';
    grid.innerHTML = '';
    EYE_DIRS.forEach(function (d) {
      var cell = document.createElement('div');
      cell.className = 'photo-cell';
      cell.style.gridColumn = d.col + 1;
      cell.style.gridRow = d.row + 1;
      cell.innerHTML = '<div class="pc-dir">' + d.name + '</div>' +
        '<div class="pc-body"><span class="pc-add">📷</span><span class="pc-hint">拍照</span></div>';
      cell.onclick = (function (dir) { return function () { pickEyePhoto(dir); }; })(d.name);
      grid.appendChild(cell);
    });
    EYE_DIRS.forEach(function (d) { if (eyeCurPhotos()[d.name]) renderEyeThumb(d.name); });
    refreshEyeStatus();
  }

  function findEyeCell(dir) {
    var cells = $('eye-grid').querySelectorAll('.photo-cell');
    for (var i = 0; i < cells.length; i++) {
      var d = cells[i].querySelector('.pc-dir');
      if (d && d.textContent === dir) return cells[i];
    }
    return null;
  }
  function renderEyeThumb(dir) {
    var cell = findEyeCell(dir);
    var p = eyeCurPhotos()[dir];
    if (cell && p) {
      cell.classList.add('filled');
      cell.innerHTML = '<div class="pc-dir">' + dir + '</div><img src="' + p.url + '" alt="' + dir + '">';
    }
  }

  function pickEyePhoto(dir) {
    eyePendingDir = dir;
    var input = $(eyeSource === 'camera' ? 'eye-input-camera' : 'eye-input');
    input.value = '';
    input.click();
  }
  function handleEyeFile(f) {
    if (!f || !eyePendingDir) return;
    openCropModal(f, eyePendingDir);
    var input = $(eyeSource === 'camera' ? 'eye-input-camera' : 'eye-input');
    input.value = '';
  }

  function refreshEyeStatus() {
    var n = EYE_DIRS.filter(function (d) { return eyeCurPhotos()[d.name]; }).length;
    var left = 9 - n;
    $('eye-status').textContent = eyeStageLabel() + '：已拍 ' + n + ' / 9' + (n < 9 ? '（还差 ' + left + ' 张）' : '，可以生成啦');
    var btn = $('eye-gen');
    btn.disabled = n < 9;      // 拍满 9 张才能生成：缺方位的眼位图对视训师没诊断价值
    btn.textContent = '生成' + eyeStageLabel() + '眼位图';
  }

  function clearEye() {
    Object.keys(eyeCurPhotos()).forEach(function (k) {
      var p = eyeCurPhotos()[k];
      if (p && p.url) URL.revokeObjectURL(p.url);
    });
    eyePhotos[eyeStage] = {};
    buildEyeGrid();
  }

  function eyeLoadImage(src) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = src;
    });
  }
  function eyeDateStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  async function generateEyeCanvas() {
    var cfg = eyeStageCfg();
    var CELL = cfg.cellW, CH = cfg.cellH;
    var LB = 30, GAP = 8, PAD = 20, TITLE = 40;
    var gw = PAD * 2 + CELL * 3 + GAP * 2;
    var gh = TITLE + PAD * 2 + CH * 3 + GAP * 2;
    var canvas = document.createElement('canvas');
    canvas.width = gw; canvas.height = gh;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, gw, gh);
    ctx.fillStyle = '#1a7a8c'; ctx.fillRect(0, 0, gw, TITLE);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(eyeChildName + ' · 眼肌拉伸 · ' + eyeStageLabel() + ' · ' + eyeDateStr(), gw / 2, TITLE / 2);
    // 九宫格：每格先裁剪再画照片，铺满整格（多余裁掉）→ 九张大小统一、不串格
    for (var i = 0; i < EYE_DIRS.length; i++) {
      var d = EYE_DIRS[i];
      var x = PAD + d.col * (CELL + GAP);
      var y = TITLE + PAD + d.row * (CH + GAP);
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, CELL, CH);
      ctx.clip();
      var p = eyeCurPhotos()[d.name];
      if (p) {
        var im = await eyeLoadImage(p.url);
        var s = Math.max(CELL / im.width, CH / im.height);
        var w = im.width * s, h = im.height * s;
        ctx.drawImage(im, x + (CELL - w) / 2, y + (CH - h) / 2, w, h);
      } else {
        ctx.fillStyle = '#eef4f6'; ctx.fillRect(x, y, CELL, CH);
        ctx.fillStyle = '#9aa7ad';
        ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('缺', x + CELL / 2, y + CH / 2);
      }
      ctx.restore();
      // 方位标签：叠在照片顶部的半透明条，不占照片高度
      ctx.fillStyle = 'rgba(26,122,140,0.85)';
      ctx.fillRect(x, y, CELL, LB);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.name, x + CELL / 2, y + LB / 2);
    }
    return canvas;
  }

  async function submitEye() {
    var btn = $('eye-gen');
    btn.disabled = true;
    btn.textContent = '上传中…';
    try {
      var canvas = await generateEyeCanvas();
      var blob = await new Promise(function (res) { canvas.toBlob(res, 'image/png'); });
      // 先传文件，再建记录（一步把路径存进去，避免"记录建了但图没传上"留空记录）
      var path = state.childId + '/eye/' + Date.now() + '_' + eyeStage + '.png';
      var up = await sb.storage.from('media').upload(path, blob, { contentType: 'image/png' });
      if (up.error) throw new Error('上传失败：' + up.error.message);
      var ins = await sb.from('records').insert({
        child_id: state.childId, type: 'eye', data: { stage: eyeStage }, media: [path]
      });
      if (ins.error) throw new Error('提交失败：' + ins.error.message);
      alert(eyeStageLabel() + '眼位图已回传，视训师能看到啦！');
      clearEye();   // 清空本阶段照片，准备拍下一个阶段
    } catch (e) {
      alert(e.message || '生成失败，请重试');
      btn.disabled = false;
      btn.textContent = '生成' + eyeStageLabel() + '眼位图';
    }
  }

  // ---------- 马斯登球（录「跟随/反/停」三段视频 → 上传给视训师）----------
  var MARSDEN_SLOTS = [
    { key: 'follow',  num: '①', title: '跟随眼动', desc: '家长摆球，孩子眼睛追随球动，录一小段' },
    { key: 'reverse', num: '②', title: '反眼动',   desc: '家长摆球，孩子眼球向反方向动，录一小段' },
    { key: 'stop',    num: '③', title: '喊停',     desc: '家长突然喊「停」，录孩子眼球停住的状态' }
  ];
  var marsdenVideos = {};       // key -> { url, file }
  var marsdenPending = null;
  var marsdenSource = 'camera';
  var marsdenChildName = '';

  function openMarsdenForm(cid, cname) {
    state.childId = cid;
    marsdenChildName = cname;

    marsdenSource = 'camera';

    c.innerHTML =

      '<p class="page-sub">孩子：' + esc(cname) + ' · 录「跟随 / 反 / 停」三段视频</p>' +
      '<div class="source-tabs">' +
        '<button class="source-tab active" data-source="camera">🎥 录像</button>' +
        '<button class="source-tab" data-source="gallery">🖼 从相册选</button>' +
      '</div>' +
      '<div id="marsden-slots"></div>' +
      '<div class="small-note">手机横屏 · 拍到孩子双眼 · 每段 10~20 秒即可</div>' +
      '<button class="btn btn-primary" id="marsden-upload" onclick="submitMarsden()" disabled>上传给视训师</button>' +
      '<button class="btn btn-ghost" onclick="home()">返回</button>' +

      '<input type="file" id="marsden-input-camera" accept="video/*" capture="environment" style="position:absolute; left:-9999px; width:1px; height:1px;">';

      srcs[i].onclick = function () {

    $('marsden-input-camera').onchange = function () { handleMarsdenFile($('marsden-input-camera').files[0]); };
    renderMarsdenSlots();

  function renderMarsdenSlots() {
    var box = $('marsden-slots');
    if (!box) return;
    box.innerHTML = '';
    var count = 0;
    MARSDEN_SLOTS.forEach(function (s) {
      var v = marsdenVideos[s.key];
      if (v) count++;
      var card = document.createElement('div');
      card.className = 'rec-card';
      var slotHtml;
      if (v) {
        slotHtml = '<div class="rec-slot"><video controls playsinline src="' + v.url + '"></video></div>' +
          '<div class="rec-actions">' +
          '<button class="rec-re" onclick="pickMarsdenSlot(\'' + s.key + '\')">↻ 重录</button>' +
          '<button class="rec-save" onclick="saveMarsdenVideo(\'' + s.key + '\')">💾 保存到本地</button>' +
          '</div>';
      } else {
        slotHtml = '<div class="rec-slot"><div class="rec-empty" onclick="pickMarsdenSlot(\'' + s.key + '\')">' +
          '<div class="ic">🎥</div><div class="t">＋ 录制这一段</div></div></div>';
      }
      card.innerHTML = '<div class="rec-head"><span class="rec-num">' + s.num + '</span>' +
        '<span class="rec-title">' + s.title + '</span></div>' +
        '<div class="rec-desc">' + s.desc + '</div>' + slotHtml;
      box.appendChild(card);
    });
    var btn = $('marsden-upload');
    btn.disabled = count === 0;
    btn.textContent = count === 0 ? '上传给视训师（先录至少一段）' : '上传给视训师（已录 ' + count + ' / 3 段）';
  }

  function pickMarsdenSlot(key) {
    marsdenPending = key;
    var input = $(marsdenSource === 'camera' ? 'marsden-input-camera' : 'marsden-input');
    input.value = '';
    input.click();
  }

  function handleMarsdenFile(f) {
    if (!f || !marsdenPending) return;
    var key = marsdenPending;
    var old = marsdenVideos[key];
    if (old && old.url) URL.revokeObjectURL(old.url);
    marsdenVideos[key] = { url: URL.createObjectURL(f), file: f };
    renderMarsdenSlots();
  }

  function saveMarsdenVideo(key) {
    var v = marsdenVideos[key];
    if (!v) return;
    var s = MARSDEN_SLOTS.filter(function (x) { return x.key === key; })[0];
    var a = document.createElement('a');
    a.href = v.url;
    a.download = (s ? s.title : '视频') + '_' + marsdenChildName + '.mp4';
    document.body.appendChild(a); a.click(); a.remove();
  }

  async function submitMarsden() {
    var keys = MARSDEN_SLOTS.filter(function (s) { return marsdenVideos[s.key]; }).map(function (s) { return s.key; });
    if (!keys.length) { alert('请先录至少一段视频'); return; }
    var btn = $('marsden-upload');
    var cid = state.childId;
    btn.disabled = true;
    try {
      var media = [];
      var originals = [];
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var v = marsdenVideos[key];
        var origExt = (v.file.name.match(/\.\w+$/) || ['mp4'])[0].toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!origExt || origExt.length > 5) origExt = 'mp4';
        // 先压缩（降分辨率+降码率），压缩不动就退回原文件
        btn.textContent = '压缩视频 ' + (i + 1) + '/' + keys.length + ' …';
        var compressed = await compressVideo(v.file, 640, 1000000);
        var ext = origExt;
        if (compressed !== v.file) {
          ext = compressed.type === 'video/webm' ? 'webm' : 'mp4';
          originals.push({ file: v.file, ext: origExt });
        }
        btn.textContent = '上传 ' + (i + 1) + '/' + keys.length + ' …';
        var path = cid + '/marsden/' + Date.now() + '_' + key + '.' + ext;
        var up = await sb.storage.from('media').upload(path, compressed, { contentType: compressed.type || v.file.type || 'video/mp4' });
        if (up.error) throw new Error('上传失败：' + up.error.message);
        media.push(path);
      }
      // 先建记录（只存压缩版，视训师立刻能看）
      var ins = await sb.from('records').insert({
        child_id: cid, type: 'marsden', data: { slots: keys }, media: media
      }).select();
      if (ins.error) throw new Error('提交失败：' + ins.error.message);
      alert('马斯登球视频已回传，视训师能看到啦！');
      home();
      // 后台补传原画质（不阻塞，失败也不影响压缩版）
      uploadMarsdenOriginals(ins.data[0].id, cid, keys, originals);
    } catch (e) {
      alert(e.message || '上传失败，请重试');
      btn.disabled = false;
      btn.textContent = '上传给视训师';
    }
  }

  async function uploadMarsdenOriginals(recId, cid, keys, originals) {
    if (!originals.length) return;
    try {
      var paths = [];
      for (var i = 0; i < originals.length; i++) {
        var o = originals[i];
        var path = cid + '/marsden/' + Date.now() + '_orig_' + i + '.' + o.ext;
        var up = await sb.storage.from('media').upload(path, o.file, { contentType: o.file.type || 'video/mp4' });
        if (!up.error) paths.push(path);
      }
      if (paths.length) {
        await sb.from('records').update({ data: { slots: keys, originals: paths } }).eq('id', recId);
      }
    } catch (e) { /* 后台原画质上传失败，忽略，不影响压缩版 */ }
  }

  // ---------- 图片查看器（仿微信：点开放大、双指缩放、拖动、双击放大）----------
  var iv = { scale: 1, tx: 0, ty: 0, maxScale: 4, g: {}, moved: false, lastTap: 0, lastX: 0, lastY: 0, mouseDrag: null };

  function openImgViewer(src) {
    iv.scale = 1; iv.tx = 0; iv.ty = 0; iv.moved = false;
    $('iv-img').src = src;
    applyIv();
    $('img-viewer').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeImgViewer() {
    $('img-viewer').classList.remove('open');
    document.body.style.overflow = '';
    iv.scale = 1; iv.tx = 0; iv.ty = 0; iv.moved = false;
  }
  function applyIv() {
    $('iv-img').style.transform = 'translate(' + iv.tx + 'px,' + iv.ty + 'px) scale(' + iv.scale + ')';
  }
  function clampIv() {
    if (iv.scale < 1) iv.scale = 1;
    if (iv.scale > iv.maxScale) iv.scale = iv.maxScale;
  }

  function ivTouchStart(e) {
    iv.moved = false;
    if (e.touches.length === 1) {
      iv.g.x = e.touches[0].clientX; iv.g.y = e.touches[0].clientY;
      iv.g.tx = iv.tx; iv.g.ty = iv.ty; iv.g.pan = true;
    } else if (e.touches.length === 2) {
      iv.g.pan = false;
      iv.g.dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
      iv.g.scale = iv.scale;
    }
  }
  function ivTouchMove(e) {
    if (e.touches.length === 1 && iv.g.pan && iv.scale > 1) {
      iv.tx = iv.g.tx + (e.touches[0].clientX - iv.g.x);
      iv.ty = iv.g.ty + (e.touches[0].clientY - iv.g.y);
      iv.moved = true; applyIv();
    } else if (e.touches.length === 2) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
      iv.scale = iv.g.scale * (d / iv.g.dist);
      iv.moved = true; clampIv(); applyIv();
    }
  }
  function ivTouchEnd(e) {
    iv.g.pan = false;
    var t = e.changedTouches[0];
    var now = Date.now();
    if (t && now - iv.lastTap < 300 &&
        Math.abs(t.clientX - iv.lastX) < 30 && Math.abs(t.clientY - iv.lastY) < 30) {
      iv.scale = iv.scale > 1.5 ? 1 : 2.5;
      if (iv.scale === 1) { iv.tx = 0; iv.ty = 0; }
      applyIv(); iv.lastTap = 0;
    } else if (t) {
      iv.lastTap = now; iv.lastX = t.clientX; iv.lastY = t.clientY;
    }
  }

  function ivWheel(e) {
    iv.scale *= e.deltaY < 0 ? 1.15 : (1 / 1.15);
    clampIv(); applyIv();
    e.preventDefault();
  }
  function ivDblClick() {
    iv.scale = iv.scale > 1.5 ? 1 : 2.5;
    if (iv.scale === 1) { iv.tx = 0; iv.ty = 0; }
    applyIv();
  }
  function ivMouseDown(e) {
    iv.moved = false;
    iv.mouseDrag = { x: e.clientX, y: e.clientY, tx: iv.tx, ty: iv.ty };
    e.preventDefault();
  }
  function ivMouseMove(e) {
    if (!iv.mouseDrag) return;
    iv.tx = iv.mouseDrag.tx + (e.clientX - iv.mouseDrag.x);
    iv.ty = iv.mouseDrag.ty + (e.clientY - iv.mouseDrag.y);
    iv.moved = true; applyIv();
  }
  function ivMouseUp() { iv.mouseDrag = null; }

  // ---------- 照片裁剪（正方形）----------
  var crop = { file: null, dir: null, img: null, s: 1, ox: 0, oy: 0, iw: 0, ih: 0, W: 0, baseScale: 1, dragging: false, lastX: 0, lastY: 0, pinch: null, _url: null };

  function openCropModal(file, dir) {
    crop.file = file; crop.dir = dir;
    crop._url = URL.createObjectURL(file);
    var img = $('crop-img');
    img.onload = initCrop;
    img.onerror = function () { alert('这张图读不出来，请换一张'); closeCrop(); };
    img.src = crop._url;
    $('crop-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function initCrop() {
    var img = $('crop-img');
    crop.img = img;
    crop.iw = img.naturalWidth || img.width;
    crop.ih = img.naturalHeight || img.height;
    crop.W = $('crop-viewport').clientWidth;
    crop.baseScale = Math.max(crop.W / crop.iw, crop.W / crop.ih);
    crop.s = crop.baseScale;
    crop.ox = (crop.W - crop.iw * crop.s) / 2;
    crop.oy = (crop.W - crop.ih * crop.s) / 2;
    applyCrop();
  }
  function applyCrop() {
    $('crop-img').style.transform = 'translate(' + crop.ox + 'px,' + crop.oy + 'px) scale(' + crop.s + ')';
  }
  function cropClamp() {
    var W = crop.W;
    crop.ox = Math.max(W - crop.iw * crop.s, Math.min(0, crop.ox));
    crop.oy = Math.max(W - crop.ih * crop.s, Math.min(0, crop.oy));
  }
  function cropVpLocal(clientX, clientY) {
    var r = $('crop-viewport').getBoundingClientRect();
    return { x: clientX - r.left, y: clientY - r.top };
  }
  function cropZoom(ratio, fx, fy) {
    var ns = crop.s * ratio;
    var maxS = crop.baseScale * 5;
    ns = Math.max(crop.baseScale, Math.min(maxS, ns));
    if (ns === crop.s) return;
    var imgX = (fx - crop.ox) / crop.s;
    var imgY = (fy - crop.oy) / crop.s;
    crop.s = ns;
    crop.ox = fx - imgX * crop.s;
    crop.oy = fy - imgY * crop.s;
    cropClamp(); applyCrop();
  }
  function cropTouchStart(e) {
    if (e.touches.length === 1) {
      var p = cropVpLocal(e.touches[0].clientX, e.touches[0].clientY);
      crop.dragging = true; crop.lastX = p.x; crop.lastY = p.y;
    } else if (e.touches.length === 2) {
      crop.dragging = false;
      var a = cropVpLocal(e.touches[0].clientX, e.touches[0].clientY);
      var b = cropVpLocal(e.touches[1].clientX, e.touches[1].clientY);
      crop.pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    }
  }
  function cropTouchMove(e) {
    if (e.touches.length === 1 && crop.dragging) {
      var p = cropVpLocal(e.touches[0].clientX, e.touches[0].clientY);
      crop.ox += p.x - crop.lastX;
      crop.oy += p.y - crop.lastY;
      crop.lastX = p.x; crop.lastY = p.y;
      cropClamp(); applyCrop();
    } else if (e.touches.length === 2 && crop.pinch) {
      var a = cropVpLocal(e.touches[0].clientX, e.touches[0].clientY);
      var b = cropVpLocal(e.touches[1].clientX, e.touches[1].clientY);
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      var cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      var ns = crop.s * (d / crop.pinch.dist);
      var maxS = crop.baseScale * 5;
      ns = Math.max(crop.baseScale, Math.min(maxS, ns));
      var imgX = (cx - crop.ox) / crop.s, imgY = (cy - crop.oy) / crop.s;
      crop.s = ns;
      crop.ox = cx - imgX * crop.s;
      crop.oy = cy - imgY * crop.s;
      crop.pinch.dist = d; crop.pinch.cx = cx; crop.pinch.cy = cy;
      cropClamp(); applyCrop();
    }
  }
  function cropTouchEnd() { crop.dragging = false; crop.pinch = null; }

  // 桌面：鼠标拖 + 滚轮缩放（真机用触屏，这两条方便电脑上测）
  function cropMouseDown(e) {
    var p = cropVpLocal(e.clientX, e.clientY);
    crop.dragging = true; crop.lastX = p.x; crop.lastY = p.y;
    e.preventDefault();
  }
  function cropMouseMove(e) {
    if (!crop.dragging) return;
    var p = cropVpLocal(e.clientX, e.clientY);
    crop.ox += p.x - crop.lastX;
    crop.oy += p.y - crop.lastY;
    crop.lastX = p.x; crop.lastY = p.y;
    cropClamp(); applyCrop();
  }
  function cropMouseUp() { crop.dragging = false; }
  function cropWheel(e) {
    var p = cropVpLocal(e.clientX, e.clientY);
    cropZoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, p.x, p.y);
    e.preventDefault();
  }

  function confirmCrop() {
    if (!crop.img || !crop.file) return;
    var OUT = 840;
    var canvas = document.createElement('canvas');
    canvas.width = OUT; canvas.height = OUT;
    var ctx = canvas.getContext('2d');
    var cropX = (0 - crop.ox) / crop.s;
    var cropY = (0 - crop.oy) / crop.s;
    var cropW = crop.W / crop.s;
    ctx.drawImage(crop.img, cropX, cropY, cropW, cropW, 0, 0, OUT, OUT);
    canvas.toBlob(function (blob) {
      var dir = crop.dir;
      var p = eyeCurPhotos();
      var old = p[dir];
      if (old && old.url) URL.revokeObjectURL(old.url);
      p[dir] = { url: URL.createObjectURL(blob), file: blob };
      renderEyeThumb(dir);
      refreshEyeStatus();
      closeCrop();
    }, 'image/jpeg', 0.9);
  }
  function closeCrop() {
    $('crop-modal').classList.remove('open');
    document.body.style.overflow = '';
    if (crop._url) { URL.revokeObjectURL(crop._url); crop._url = null; }
    crop.file = null; crop.dir = null; crop.img = null; crop.dragging = false; crop.pinch = null;
  }

  // ---------- 绑定事件 ----------
  $('login-btn').onclick = signIn;
  $('signup-btn').onclick = signUp;
  $('logout-btn').onclick = signOut;

  // 图片查看器：绑定手势与关闭
  var ivEl = $('img-viewer'), ivImg = $('iv-img');
  $('iv-close').onclick = closeImgViewer;
  ivEl.addEventListener('click', function (e) {
    if (iv.moved) { iv.moved = false; return; }
    if (e.target === ivEl) closeImgViewer();
  });
  ivEl.addEventListener('touchstart', ivTouchStart, { passive: true });
  ivEl.addEventListener('touchmove', ivTouchMove, { passive: true });
  ivEl.addEventListener('touchend', ivTouchEnd, { passive: true });
  ivEl.addEventListener('wheel', ivWheel, { passive: false });
  ivImg.addEventListener('dblclick', ivDblClick);
  ivImg.addEventListener('mousedown', ivMouseDown);
  document.addEventListener('mousemove', ivMouseMove);
  document.addEventListener('mouseup', ivMouseUp);

  // 裁剪弹窗：绑定手势与按钮
  var cropVp = $('crop-viewport');
  $('crop-cancel').onclick = closeCrop;
  $('crop-done').onclick = confirmCrop;
  cropVp.addEventListener('touchstart', cropTouchStart, { passive: true });
  cropVp.addEventListener('touchmove', cropTouchMove, { passive: true });
  cropVp.addEventListener('touchend', cropTouchEnd, { passive: true });
  cropVp.addEventListener('mousedown', cropMouseDown);
  document.addEventListener('mousemove', cropMouseMove);
  document.addEventListener('mouseup', cropMouseUp);
  cropVp.addEventListener('wheel', cropWheel, { passive: false });

  // 启动：已登录则直接进入
  (async function init() {
    var res = await sb.auth.getSession();
    if (res.data && res.data.session) afterLogin(res.data.session.user);
  })();
</script>
</body>
</html>
